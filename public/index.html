<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ОПС Журнал">
<meta name="theme-color" content="#0a0a14">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-192.png">
<title>ОПС Журнал</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0a14;
  --bg2: #111120;
  --bg3: #1a1a2e;
  --border: #2a2a45;
  --border2: #3a3a5a;
  --accent: #4f7fff;
  --accent2: #6b8fff;
  --green: #2ecc71;
  --yellow: #f39c12;
  --red: #e74c3c;
  --text: #e8e8f0;
  --text2: #9090b0;
  --text3: #5a5a7a;
  --font: 'Golos Text', sans-serif;
  --mono: 'JetBrains Mono', monospace;
  --radius: 14px;
  --radius-sm: 8px;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: var(--font); }

/* Layout */
.app { display: flex; flex-direction: column; height: 100dvh; }
.header { padding: 12px 16px 10px; background: var(--bg2); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
.header-left { display: flex; align-items: center; gap: 10px; }
.header-icon { width: 32px; height: 32px; background: var(--accent); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 16px; }
.header-title { font-size: 16px; font-weight: 600; color: var(--text); }
.header-sub { font-size: 11px; color: var(--text3); margin-top: 1px; }
.sync-btn { width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--border); background: transparent; color: var(--text2); display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 16px; transition: all .2s; }
.sync-btn:active { background: var(--bg3); }
.sync-btn.syncing { animation: spin 1s linear infinite; color: var(--accent); }
@keyframes spin { to { transform: rotate(360deg); } }

.content { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.nav { display: grid; grid-template-columns: repeat(6, 1fr); background: var(--bg2); border-top: 1px solid var(--border); flex-shrink: 0; padding-bottom: env(safe-area-inset-bottom); }
.nav-item { position: relative; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 10px 4px; cursor: pointer; border: none; background: transparent; color: var(--text3); font-family: var(--font); font-size: 10px; transition: color .2s; }
.nav-item.active { color: var(--accent); }
.nav-item svg { width: 22px; height: 22px; }

/* Screens */
.screen { display: none; padding: 0; }
.screen.active { display: block; }

/* Cards */
.card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; margin: 12px 14px 0; }
.card:last-child { margin-bottom: 12px; }
.card-title { font-size: 13px; font-weight: 600; color: var(--text2); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 10px; }

/* Object cards */
.obj-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; margin: 10px 14px 0; cursor: pointer; transition: border-color .2s; }
.obj-card:active { border-color: var(--accent); }
.obj-card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
.obj-name { font-size: 15px; font-weight: 600; color: var(--text); }
.status-pill { font-size: 11px; font-weight: 500; padding: 3px 9px; border-radius: 99px; }
.status-active { background: rgba(46,204,113,.15); color: var(--green); }
.status-paused { background: rgba(243,156,18,.15); color: var(--yellow); }
.status-problem { background: rgba(231,76,60,.15); color: var(--red); }
.status-done { background: rgba(144,144,176,.15); color: var(--text2); }
.obj-meta { font-size: 12px; color: var(--text3); display: flex; gap: 12px; flex-wrap: wrap; }
.obj-stat { display: flex; align-items: center; gap: 4px; }

/* Form */
.form-group { margin-bottom: 14px; }
.form-label { font-size: 12px; color: var(--text2); margin-bottom: 6px; display: block; font-weight: 500; }
.form-input, .form-textarea, .form-select {
  width: 100%; background: var(--bg3); border: 1px solid var(--border); border-radius: var(--radius-sm);
  color: var(--text); font-family: var(--font); font-size: 14px; padding: 10px 12px;
  outline: none; transition: border-color .2s;
}
.form-input:focus, .form-textarea:focus, .form-select:focus { border-color: var(--accent); }
.form-textarea { resize: none; height: 90px; }
.form-select option { background: var(--bg3); }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* Buttons */
.btn { width: 100%; padding: 13px; border-radius: var(--radius-sm); border: none; font-family: var(--font); font-size: 14px; font-weight: 600; cursor: pointer; transition: opacity .2s; }
.btn:active { opacity: .8; }
.btn-primary { background: var(--accent); color: #fff; }
.btn-secondary { background: var(--bg3); color: var(--text); border: 1px solid var(--border); }
.btn-danger { background: rgba(231,76,60,.15); color: var(--red); border: 1px solid rgba(231,76,60,.3); }
.btn-sm { width: auto; padding: 7px 14px; font-size: 13px; }

/* Work entry */
.entry-card { background: var(--bg3); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px; margin-bottom: 8px; }
.entry-date { font-size: 11px; color: var(--text3); font-family: var(--mono); margin-bottom: 4px; }
.entry-text { font-size: 13px; color: var(--text); line-height: 1.5; }
.entry-footer { display: flex; gap: 8px; margin-top: 6px; flex-wrap: wrap; }
.entry-tag { font-size: 11px; padding: 2px 8px; border-radius: 99px; background: rgba(79,127,255,.15); color: var(--accent2); }
.entry-tag.problem { background: rgba(231,76,60,.15); color: var(--red); }
.entry-pending { border-color: var(--yellow); }
.entry-pending .entry-date::after { content: ' · ожидает синхронизации'; color: var(--yellow); }

/* Quick actions */
.quick-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 14px; }
.quick-btn { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 12px; cursor: pointer; text-align: center; transition: border-color .2s; }
.quick-btn:active { border-color: var(--accent); }
.quick-btn-icon { font-size: 28px; margin-bottom: 6px; }
.quick-btn-label { font-size: 13px; color: var(--text); font-weight: 500; }
.quick-btn-sub { font-size: 11px; color: var(--text3); margin-top: 2px; }

/* Stats */
.stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stat-card { background: var(--bg3); border-radius: var(--radius-sm); padding: 12px; text-align: center; }
.stat-val { font-size: 24px; font-weight: 700; color: var(--text); font-family: var(--mono); }
.stat-lbl { font-size: 11px; color: var(--text3); margin-top: 3px; }

/* Progress bar */
.progress-wrap { margin-top: 8px; }
.progress-label { display: flex; justify-content: space-between; font-size: 11px; color: var(--text3); margin-bottom: 4px; }
.progress-bar { height: 6px; background: var(--bg3); border-radius: 3px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--accent); border-radius: 3px; transition: width .4s; }

/* Offline banner */
.offline-banner { background: rgba(243,156,18,.15); border: 1px solid rgba(243,156,18,.3); border-radius: var(--radius-sm); padding: 10px 14px; margin: 12px 14px 0; display: none; align-items: center; gap: 8px; font-size: 13px; color: var(--yellow); }
.offline-banner.show { display: flex; }

/* Toast */
.toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--bg3); border: 1px solid var(--border2); border-radius: var(--radius-sm); padding: 10px 16px; font-size: 13px; color: var(--text); white-space: nowrap; opacity: 0; transition: all .3s; z-index: 999; pointer-events: none; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* FAB */
.fab { position: fixed; bottom: calc(70px + env(safe-area-inset-bottom)); right: 16px; width: 52px; height: 52px; border-radius: 50%; background: var(--accent); border: none; color: #fff; font-size: 24px; cursor: pointer; box-shadow: 0 4px 20px rgba(79,127,255,.4); display: flex; align-items: center; justify-content: center; transition: transform .2s; z-index: 10; }
.fab:active { transform: scale(.93); }

/* Modal */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.7); z-index: 100; display: none; align-items: flex-end; }
.modal-overlay.show { display: flex; }
.modal { background: var(--bg2); border-radius: var(--radius) var(--radius) 0 0; border: 1px solid var(--border); width: 100%; max-height: 85vh; overflow-y: auto; padding: 20px 16px calc(20px + env(safe-area-inset-bottom)); }
.modal-handle { width: 36px; height: 4px; background: var(--border2); border-radius: 2px; margin: 0 auto 16px; }
.modal-title { font-size: 17px; font-weight: 600; margin-bottom: 16px; }

/* Section header */
.section-header { padding: 16px 14px 8px; font-size: 13px; font-weight: 600; color: var(--text2); text-transform: uppercase; letter-spacing: .06em; }

/* Empty state */
.empty { text-align: center; padding: 48px 20px; color: var(--text3); }
.empty-icon { font-size: 40px; margin-bottom: 10px; }
.empty-text { font-size: 14px; line-height: 1.5; }

/* Problem badge */
.prob-badge { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; padding: 4px 10px; border-radius: 99px; margin-bottom: 8px; }
.prob-open { background: rgba(231,76,60,.15); color: var(--red); }
.prob-solved { background: rgba(46,204,113,.15); color: var(--green); }

/* Photo grid */
.photo-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; margin-top: 10px; }
.photo-thumb { aspect-ratio: 1; background: var(--bg3); border-radius: 4px; overflow: hidden; cursor: pointer; }
.photo-thumb img { width: 100%; height: 100%; object-fit: cover; }

/* Pending count badge */
.pending-badge { background: var(--yellow); color: #000; font-size: 10px; font-weight: 700; width: 16px; height: 16px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; margin-left: 4px; }

/* Login screen */
.login-screen { position: fixed; inset: 0; z-index: 200; background: var(--bg); display: none; align-items: center; justify-content: center; padding: 24px; }
.login-screen.show { display: flex; }
.login-box { width: 100%; max-width: 340px; text-align: center; }
.login-logo { font-size: 56px; margin-bottom: 14px; }
.login-title { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
.login-sub { font-size: 13px; color: var(--text3); margin-bottom: 22px; }
.login-box .form-input { text-align: center; font-size: 18px; letter-spacing: .04em; }
.login-hint { font-size: 12px; color: var(--text3); margin-top: 16px; line-height: 1.5; }
.member-code { font-size: 12px; color: var(--text2); margin-top: 3px; }
.member-code b { font-family: var(--mono); color: var(--accent2); font-weight: 500; }

/* Chat */
.chat-list { padding: 14px; padding-bottom: 80px; display: flex; flex-direction: column; gap: 8px; }
.chat-msg { max-width: 80%; padding: 8px 12px; border-radius: 14px; font-size: 14px; line-height: 1.4; word-wrap: break-word; white-space: pre-wrap; }
.chat-msg .chat-meta { font-size: 11px; margin-bottom: 3px; opacity: .85; }
.chat-mine { align-self: flex-end; background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
.chat-other { align-self: flex-start; background: var(--bg3); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
.chat-input-bar { position: fixed; left: 0; right: 0; bottom: calc(57px + env(safe-area-inset-bottom)); display: flex; gap: 8px; padding: 10px 12px; background: var(--bg2); border-top: 1px solid var(--border); z-index: 9; }
.chat-input-bar input { flex: 1; background: var(--bg); border: 1px solid var(--border); border-radius: 20px; padding: 10px 14px; color: var(--text); font-family: var(--font); font-size: 14px; outline: none; }
.chat-input-bar input:focus { border-color: var(--accent); }
.chat-send { background: var(--accent); color: #fff; border: none; border-radius: 50%; width: 40px; height: 40px; font-size: 15px; cursor: pointer; flex-shrink: 0; }

/* Chat extras */
.nav-badge { position: absolute; top: 4px; left: calc(50% + 4px); min-width: 16px; height: 16px; padding: 0 4px; background: var(--red); color: #fff; font-size: 10px; font-weight: 700; border-radius: 8px; display: flex; align-items: center; justify-content: center; line-height: 1; }
.chat-date { align-self: center; font-size: 11px; color: var(--text3); background: var(--bg3); padding: 3px 12px; border-radius: 12px; margin: 8px 0 2px; }
.chat-jump { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(112px + env(safe-area-inset-bottom)); background: var(--accent); color: #fff; border: none; border-radius: 20px; padding: 8px 16px; font-size: 13px; font-weight: 600; cursor: pointer; z-index: 9; box-shadow: 0 4px 16px rgba(79,127,255,.4); }
.chat-retry { cursor: pointer; text-decoration: underline; }
</style>
</head>
<body>

<!-- Login screen -->
<div class="login-screen" id="loginScreen">
  <div class="login-box">
    <div class="login-logo">🔥</div>
    <div class="login-title">ОПС Журнал</div>
    <div class="login-sub">Введите ваш код доступа</div>
    <input class="form-input" id="loginCode" type="text" placeholder="Код" autocomplete="off"
           onkeydown="if(event.key==='Enter')doLogin()">
    <button class="btn btn-primary" onclick="doLogin()" style="margin-top:12px">Войти</button>
    <div class="login-hint">Личный код выдаёт инженер.<br>Инженер входит своим кодом.</div>
  </div>
</div>

<div class="app">
  <div class="header">
    <div class="header-left">
      <div class="header-icon">🔥</div>
      <div>
        <div class="header-title" id="headerTitle">ОПС Журнал</div>
        <div class="header-sub" id="headerSub">Загрузка...</div>
      </div>
    </div>
    <button class="sync-btn" id="syncBtn" onclick="syncAll()" title="Синхронизировать">↻</button>
  </div>

  <div class="offline-banner" id="offlineBanner">
    ⚡ Офлайн — записи сохраняются локально
  </div>

  <div class="content" id="mainContent">
    <!-- Dynamic content -->
  </div>

  <nav class="nav">
    <button class="nav-item active" onclick="showScreen('home')" id="nav-home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      Главная
    </button>
    <button class="nav-item" onclick="showScreen('objects')" id="nav-objects">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
      Объекты
    </button>
    <button class="nav-item" onclick="showScreen('projects')" id="nav-projects">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h6a4 4 0 014 4v14a3 3 0 00-3-3H2z"/><path d="M22 3h-6a4 4 0 00-4 4v14a3 3 0 013-3h7z"/></svg>
      Проекты
    </button>
    <button class="nav-item" onclick="showScreen('journal')" id="nav-journal">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
      Журнал
    </button>
    <button class="nav-item" onclick="showScreen('chat')" id="nav-chat">
      <span class="nav-badge" id="chatBadge" style="display:none"></span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"/></svg>
      Чат
    </button>
    <button class="nav-item" onclick="showScreen('profile')" id="nav-profile">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      Профиль
    </button>
    <button class="nav-item" onclick="showScreen('team')" id="nav-team" style="display:none">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
      Команда
    </button>
  </nav>
</div>

<!-- FAB -->
<button class="fab" id="fabBtn" onclick="showAddEntry()">+</button>

<!-- Add Entry Modal -->
<div class="modal-overlay" id="addEntryModal">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">📋 Внести работы</div>
    <div class="form-group">
      <label class="form-label">Объект</label>
      <select class="form-select" id="entryObject"></select>
    </div>
    <div class="form-group">
      <label class="form-label">Описание работ</label>
      <textarea class="form-textarea" id="entryText" placeholder="Например: Протянули 150м КПСнг на 3 этаже, установили 12 дымовых датчиков..."></textarea>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Кабель (м)</label>
        <input class="form-input" type="number" id="entryCable" placeholder="0">
      </div>
      <div class="form-group">
        <label class="form-label">Устройства (шт)</label>
        <input class="form-input" type="number" id="entryDevices" placeholder="0">
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">Проблема (если есть)</label>
      <input class="form-input" id="entryProblem" placeholder="Нет стройготовности, нет лотков...">
    </div>
    <button class="btn btn-primary" onclick="saveEntry()" style="margin-bottom:10px">💾 Сохранить запись</button>
    <button class="btn btn-secondary" onclick="closeModal('addEntryModal')">Отмена</button>
  </div>
</div>

<!-- Add Object Modal -->
<div class="modal-overlay" id="addObjectModal">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">🏗 Новый объект</div>
    <div class="form-group">
      <label class="form-label">Название</label>
      <input class="form-input" id="objName" placeholder="ЖК Северный, БЦ Орбита...">
    </div>
    <div class="form-group">
      <label class="form-label">Адрес</label>
      <input class="form-input" id="objAddress" placeholder="ул. Ленина, 15">
    </div>
    <div class="form-group">
      <label class="form-label">Заказчик</label>
      <input class="form-input" id="objCustomer" placeholder="ООО СтройГрупп">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">План кабеля (м)</label>
        <input class="form-input" type="number" id="objPlanCable" placeholder="0">
      </div>
      <div class="form-group">
        <label class="form-label">План устройств</label>
        <input class="form-input" type="number" id="objPlanDevices" placeholder="0">
      </div>
    </div>
    <button class="btn btn-primary" onclick="saveObject()" style="margin-bottom:10px">✅ Создать объект</button>
    <button class="btn btn-secondary" onclick="closeModal('addObjectModal')">Отмена</button>
  </div>
</div>

<!-- Object Detail Modal -->
<div class="modal-overlay" id="objectDetailModal">
  <div class="modal">
    <div class="modal-handle"></div>
    <div id="objectDetailContent"></div>
    <button class="btn btn-secondary" onclick="closeModal('objectDetailModal')" style="margin-top:10px">Закрыть</button>
  </div>
</div>

<!-- Add/Edit Project Modal -->
<div class="modal-overlay" id="addProjectModal">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title" id="projModalTitle">📐 Новый проект</div>
    <div class="form-group">
      <label class="form-label">Объект</label>
      <select class="form-select" id="projObject"></select>
    </div>
    <div class="form-group">
      <label class="form-label">Подсистема</label>
      <select class="form-select" id="projType">
        <option>СПС</option><option>СОУЭ</option><option>СОТС</option>
        <option>СКУД</option><option>АППЗ</option><option>Другое</option>
      </select>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">План кабеля (м)</label>
        <input class="form-input" type="number" id="projPlanCable" placeholder="0">
      </div>
      <div class="form-group">
        <label class="form-label">Тип кабеля</label>
        <input class="form-input" id="projCableType" placeholder="КПСнг(А)-FRLS">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">

<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/legacy/build/pdf.min.js"></script>
<script>
// ─── Config & State ───
const API_URL = window.location.origin;
let state = {
  user: JSON.parse(localStorage.getItem('ops_user') || 'null'),
  objects: JSON.parse(localStorage.getItem('ops_objects') || '[]'),
  entries: JSON.parse(localStorage.getItem('ops_entries') || '[]'),
  pendingEntries: JSON.parse(localStorage.getItem('ops_pending') || '[]'),
  team: JSON.parse(localStorage.getItem('ops_team') || '[]'),
  projects: JSON.parse(localStorage.getItem('ops_projects') || '[]'),
  shleyfy: JSON.parse(localStorage.getItem('ops_shleyfy') || '[]'),
  shleyfLog: JSON.parse(localStorage.getItem('ops_shleyflog') || '[]'),
  planSegments: JSON.parse(localStorage.getItem('ops_segments') || '[]'),
  devices: JSON.parse(localStorage.getItem('ops_devices') || '[]'),
  drawings: JSON.parse(localStorage.getItem('ops_drawings') || '[]'),
  messages: JSON.parse(localStorage.getItem('ops_messages') || '[]'),
  pendingMsgs: [],
  currentScreen: 'home',
  isOnline: navigator.onLine,
};
const STATUS_LABELS = { active:'В работе', paused:'Приостановлен', problem:'Проблема', done:'Завершён' };

function isEngineer() { return state.user?.role === 'engineer' || state.user?.role === 'admin'; }
function myName() { return state.user?.name || 'Монтажник'; }
function allEntries() { return [...state.entries, ...state.pendingEntries]; }

// Objects the current user is allowed to see
function visibleObjects() {
  if (isEngineer()) return state.objects;
  const myId = state.user?.teamId;
  return state.objects.filter(o => Array.isArray(o.assignedTo) && myId && o.assignedTo.includes(myId));
}

// ─── Offline detection ───
window.addEventListener('online',  () => { state.isOnline = true;  updateOfflineBanner(); syncAll(); });
window.addEventListener('offline', () => { state.isOnline = false; updateOfflineBanner(); });

const APP_VERSION = 'v28'; // видимая метка версии — должна совпадать с кэшем в sw.js
function updateOfflineBanner() {
  const banner = document.getElementById('offlineBanner');
  banner.classList.toggle('show', !state.isOnline);
  document.getElementById('headerSub').textContent = (state.isOnline
    ? (isEngineer() ? '👑 Инженер' : 'Монтажник')
    : 'Офлайн — данные сохраняются') + ' · ' + APP_VERSION;
}

// ─── Navigation ───
function showScreen(name) {
  state.currentScreen = name;
  document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
  document.getElementById(`nav-${name}`).classList.add('active');
  const fab = document.getElementById('fabBtn');
  fab.style.display = ['home','journal'].includes(name) ? 'flex' : 'none';
  const titles = { home: 'ОПС Журнал', objects: 'Объекты', projects: 'Проекты', journal: 'Журнал работ', chat: 'Чат бригады', profile: 'Профиль' };
  document.getElementById('headerTitle').textContent = titles[name];
  renderScreen(name);
  if (chatPollTimer) { clearInterval(chatPollTimer); chatPollTimer = null; }
  if (name === 'chat') {
    if (bgPollTimer) { clearInterval(bgPollTimer); bgPollTimer = null; }
    markChatSeen();
    pollMessages();
    chatPollTimer = setInterval(pollMessages, 4000);
  } else if (!bgPollTimer && state.user?.token) {
    bgPollTimer = setInterval(pollMessages, 10000);
  }
  updateChatBadge();
}
function renderScreen(name) {
  const c = document.getElementById('mainContent');
  if (name === 'home')    renderHome(c);
  if (name === 'objects') renderObjects(c);
  if (name === 'projects') renderProjects(c);
  if (name === 'chat') renderChat(c);
  if (name === 'journal') renderJournal(c);
  if (name === 'profile') renderProfile(c);
}

// ─── Home ───
function renderHome(c) {
  const today = new Date().toDateString();
  const myEntries = isEngineer() ? allEntries() : allEntries().filter(e => e.userName === myName());
  const todayEntries = myEntries.filter(e => new Date(e.ts).toDateString() === today);
  const pending = state.pendingEntries.length;
  const openProblems = myEntries.filter(e => e.problem && e.problem.trim()).length;
  const objs = visibleObjects();
  const activeObjs = objs.filter(o => o.status === 'active').length;
  c.innerHTML = `
    <div style="padding:14px">
      <div class="stats-grid" style="margin-bottom:12px">
        <div class="stat-card"><div class="stat-val">${activeObjs}</div><div class="stat-lbl">Активных объектов</div></div>
        <div class="stat-card"><div class="stat-val">${todayEntries.length}</div><div class="stat-lbl">Записей сегодня</div></div>
        <div class="stat-card"><div class="stat-val" style="color:${pending>0?'var(--yellow)':'var(--green)'}">${pending}</div><div class="stat-lbl">Ожидают синхронизации</div></div>
        <div class="stat-card"><div class="stat-val" style="color:${openProblems>0?'var(--red)':'var(--green)'}">${openProblems}</div><div class="stat-lbl">Открытых проблем</div></div>
      </div>
    </div>
    <div class="quick-grid">
      <div class="quick-btn" onclick="showAddEntry()"><div class="quick-btn-icon">✍️</div><div class="quick-btn-label">Внести работы</div><div class="quick-btn-sub">Запись в журнал</div></div>
      <div class="quick-btn" onclick="showScreen('objects')"><div class="quick-btn-icon">🏗</div><div class="quick-btn-label">Объекты</div><div class="quick-btn-sub">${objs.length} объектов</div></div>
      <div class="quick-btn" onclick="takePhoto()"><div class="quick-btn-icon">📷</div><div class="quick-btn-label">Фото</div><div class="quick-btn-sub">Прикрепить</div></div>
      <div class="quick-btn" onclick="reportProblem()"><div class="quick-btn-icon">⚠️</div><div class="quick-btn-label">Проблема</div><div class="quick-btn-sub">Зафиксировать</div></div>
    </div>
    ${todayEntries.length > 0 ? `
    <div class="section-header">Сегодня</div>
    <div style="padding:0 14px">${todayEntries.sort((a,b)=>b.ts-a.ts).slice(0,3).map(e => entryCardHtml(e)).join('')}</div>` : ''}
  `;
}

// ─── Objects ───
function renderObjects(c) {
  const objs = visibleObjects();
  if (objs.length === 0) {
    c.innerHTML = `
      <div class="empty"><div class="empty-icon">🏗</div><div class="empty-text">${isEngineer()?'Объектов пока нет.<br>Добавьте первый объект.':'Вам пока не назначен ни один объект.<br>Обратитесь к инженеру.'}</div></div>
      ${isEngineer()?`<div style="padding:0 14px"><button class="btn btn-primary" onclick="showModal('addObjectModal')">+ Добавить объект</button></div>`:''}`;
    return;
  }
  c.innerHTML = `
    ${isEngineer()?`<div style="padding:14px 14px 0"><button class="btn btn-primary btn-sm" onclick="showModal('addObjectModal')">+ Новый объект</button></div>`:''}
    ${objs.map(o => {
      const entries = allEntries().filter(e => e.objectId === o.id);
      const totalCable = entries.reduce((s,e) => s+(parseInt(e.cable)||0), 0);
      const totalDevices = entries.reduce((s,e) => s+(parseInt(e.devices)||0), 0);
      const pctCable = o.planCable > 0 ? Math.min(totalCable/o.planCable*100, 100) : 0;
      const assignedCount = Array.isArray(o.assignedTo) ? o.assignedTo.length : 0;
      return `
      <div class="obj-card" onclick="showObjectDetail('${o.id}')">
        <div class="obj-card-header">
          <span class="obj-name">${o.name}</span>
          <span class="status-pill status-${o.status}">${STATUS_LABELS[o.status]||o.status}</span>
        </div>
        <div class="obj-meta">
          ${o.address ? `<span>📍 ${o.address}</span>` : ''}
          ${isEngineer() ? `<span>👷 ${assignedCount}</span>` : ''}
          <span>🔌 ${totalCable} м</span>
          <span>📡 ${totalDevices} шт</span>
        </div>
        ${o.planCable > 0 ? `
        <div class="progress-wrap">
          <div class="progress-label"><span>Кабель</span><span>${totalCable}/${o.planCable} м</span></div>
          <div class="progress-bar"><div class="progress-fill" style="width:${pctCable}%"></div></div>
        </div>` : ''}
      </div>`;
    }).join('')}
    <div style="height:14px"></div>
  `;
}

// ─── Journal ───
function renderJournal(c) {
  let all = [...state.entries, ...state.pendingEntries.map(e => ({...e, pending: true}))];
  if (!isEngineer()) all = all.filter(e => e.userName === myName());
  all.sort((a,b) => b.ts - a.ts);
  if (all.length === 0) {
    c.innerHTML = `<div class="empty"><div class="empty-icon">📋</div><div class="empty-text">Журнал пуст.<br>Добавьте первую запись.</div></div>`;
    return;
  }
  const groups = {};
  all.forEach(e => {
    const d = new Date(e.ts).toLocaleDateString('ru-RU', {day:'numeric',month:'long'});
    (groups[d] = groups[d] || []).push(e);
  });
  c.innerHTML = Object.entries(groups).map(([date, entries]) => `
    <div class="section-header">${date}</div>
    <div style="padding:0 14px">${entries.map(e => entryCardHtml(e)).join('')}</div>
  `).join('') + '<div style="height:80px"></div>';
}

function entryCardHtml(e) {
  const obj = state.objects.find(o => o.id === e.objectId);
  const time = new Date(e.ts).toLocaleTimeString('ru-RU', {hour:'2-digit',minute:'2-digit'});
  const who = (isEngineer() && e.userName) ? ` · 👷 ${e.userName}` : '';
  return `
  <div class="entry-card ${e.pending?'entry-pending':''}">
    <div class="entry-date">${time}${obj ? ' · ' + obj.name : ''}${who}</div>
    <div class="entry-text">${e.text}</div>
    <div class="entry-footer">
      ${e.cable > 0 ? `<span class="entry-tag">🔌 ${e.cable} м</span>` : ''}
      ${e.devices > 0 ? `<span class="entry-tag">📡 ${e.devices} шт</span>` : ''}
      ${e.problem ? `<span class="entry-tag problem">⚠️ ${e.problem}</span>` : ''}
    </div>
  </div>`;
}

// ─── Profile (role toggle + team management) ───
function renderProfile(c) {
  const mine = isEngineer() ? state.entries : state.entries.filter(e => e.userName === myName());
  const totalCable = mine.reduce((s,e) => s+(parseInt(e.cable)||0), 0);
  const totalDevices = mine.reduce((s,e) => s+(parseInt(e.devices)||0), 0);
  const week = Date.now() - 7*24*3600*1000;
  const weekCable = mine.filter(e => e.ts > week).reduce((s,e) => s+(parseInt(e.cable)||0), 0);

  c.innerHTML = `
    <div style="padding:14px">
      <div class="card" style="text-align:center;margin:0 0 12px">
        <div style="font-size:48px;margin-bottom:8px">${isEngineer()?'👑':'👷'}</div>
        <div style="font-size:18px;font-weight:600">${myName()}</div>
        <div style="font-size:13px;color:var(--text3);margin-top:4px">${isEngineer()?'Инженер':'Монтажник'}</div>
      </div>

      ${isEngineer() ? `
      <div class="card" style="margin:0 0 12px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
          <div class="card-title" style="margin:0">👷 Команда (${state.team.length})</div>
          <button class="btn btn-primary btn-sm" onclick="addTeamMember()">+ Добавить</button>
        </div>
        ${state.team.length === 0 ? `<div style="font-size:13px;color:var(--text3)">Монтажников пока нет. Добавьте, чтобы назначать на объекты.</div>` :
          state.team.map(t => `<div class="entry-card" style="display:flex;justify-content:space-between;align-items:center;gap:8px">
            <div>
              <div>👷 ${t.name}</div>
              <div class="member-code">Код входа: <b>${t.code || '—'}</b></div>
            </div>
            <div style="display:flex;gap:6px;flex-shrink:0">
              ${t.code ? `<button class="btn btn-secondary btn-sm" onclick="copyCode('${t.code}')">Копир.</button>` : `<button class="btn btn-secondary btn-sm" onclick="genCode('${t.id}')">Код</button>`}
              <button class="btn btn-danger btn-sm" onclick="removeTeamMember('${t.id}')">×</button>
            </div>
          </div>`).join('')}
      </div>` : ''}

      <div class="card" style="margin:0 0 12px">
        <div class="card-title">${isEngineer()?'Сводка (вся бригада)':'Мои показатели'}</div>
        <div class="stats-grid">
          <div class="stat-card"><div class="stat-val">${totalCable}</div><div class="stat-lbl">Метров кабеля</div></div>
          <div class="stat-card"><div class="stat-val">${totalDevices}</div><div class="stat-lbl">Устройств</div></div>
          <div class="stat-card"><div class="stat-val">${mine.length}</div><div class="stat-lbl">Записей</div></div>
          <div class="stat-card"><div class="stat-val">${weekCable}</div><div class="stat-lbl">Метров за неделю</div></div>
        </div>
      </div>

      <div class="card" style="margin:0 0 12px">
        <div class="card-title">Синхронизация</div>
        <div style="font-size:13px;color:var(--text2);margin-bottom:10px">Ожидают синхронизации: <strong style="color:${state.pendingEntries.length>0?'var(--yellow)':'var(--green)'}">${state.pendingEntries.length} записей</strong></div>
        <button class="btn btn-primary btn-sm" onclick="syncAll()">↻ Синхронизировать сейчас</button>
      </div>

      <div class="card" style="margin:0">
        <div class="card-title">Сервер</div>
        <div style="font-size:13px;color:var(--text2);margin-bottom:10px">Статус: <strong style="color:${state.isOnline?'var(--green)':'var(--red)'}">${state.isOnline?'Онлайн':'Офлайн'}</strong></div>
        <button class="btn btn-secondary btn-sm" onclick="logout()">Выйти</button>
      </div>
    </div>`;
}

// ─── Login / logout ───
async function doLogin() {
  const input = document.getElementById('loginCode');
  const code = (input.value || '').trim();
  if (!code) { showToast('Введите код'); return; }
  if (!navigator.onLine) { showToast('Для входа нужен интернет'); return; }
  try {
    const res = await fetch(`${API_URL}/api/login`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code }),
    });
    if (!res.ok) { showToast(res.status === 403 ? 'Неверный код' : 'Ошибка входа'); return; }
    const data = await res.json();
    state.user = { token: data.token, name: data.name, role: data.role, teamId: data.teamId || null };
    // чистим локальные данные — дальше всё придёт с сервера по роли
    state.objects = []; state.entries = []; state.pendingEntries = []; state.team = []; state.projects = []; state.messages = []; state.pendingMsgs = []; localStorage.removeItem('ops_chat_seen');
    input.value = '';
    saveLocal();
    startApp();
  } catch { showToast('Нет связи с сервером'); }
}

async function logout() {
  if (!confirm('Выйти из приложения?')) return;
  try {
    if (state.user?.token) {
      await fetch(`${API_URL}/api/logout`, { method: 'POST', headers: { 'Authorization': `Bearer ${state.user.token}` } });
    }
  } catch {}
  localStorage.clear();
  location.reload();
}

// ─── Коды доступа монтажников ───
function genUniqueCode() {
  const used = new Set(state.team.map(t => t.code).filter(Boolean));
  let c;
  do { c = String(Math.floor(100000 + Math.random() * 900000)); } while (used.has(c));
  return c;
}
function genCode(id) {
  const t = state.team.find(x => x.id === id);
  if (!t) return;
  t.code = genUniqueCode();
  saveLocal(); syncTeam(); renderScreen('profile');
  showToast('Код: ' + t.code);
}
function copyCode(code) {
  if (navigator.clipboard) navigator.clipboard.writeText(code).then(() => showToast('Скопировано: ' + code)).catch(() => showToast('Код: ' + code));
  else showToast('Код: ' + code);
}

// ─── Team management ───
function addTeamMember() {
  const name = prompt('Имя монтажника:');
  if (!name || !name.trim()) return;
  const code = genUniqueCode();
  state.team.push({ id: 'm' + Date.now(), name: name.trim(), role: 'worker', code });
  saveLocal(); syncTeam(); renderScreen('profile'); showToast('✅ Добавлен. Код входа: ' + code);
}
function removeTeamMember(id) {
  if (!confirm('Удалить монтажника из команды?')) return;
  state.team = state.team.filter(t => t.id !== id);
  state.objects.forEach(o => { if (Array.isArray(o.assignedTo)) o.assignedTo = o.assignedTo.filter(x => x !== id); });
  saveLocal(); syncTeam(); syncObjects(); renderScreen('profile'); showToast('Удалён');
}

// ─── Object Detail ───
function showObjectDetail(id) {
  const obj = state.objects.find(o => o.id === id);
  if (!obj) return;
  if (!Array.isArray(obj.assignedTo)) obj.assignedTo = [];
  const entries = allEntries().filter(e => e.objectId === id).sort((a,b) => b.ts-a.ts);
  const totalCable = entries.reduce((s,e) => s+(parseInt(e.cable)||0), 0);
  const totalDevices = entries.reduce((s,e) => s+(parseInt(e.devices)||0), 0);
  const problems = entries.filter(e => e.problem && e.problem.trim());

  const byWorker = {};
  entries.forEach(e => {
    const n = e.userName || 'Без имени';
    if (!byWorker[n]) byWorker[n] = { cable:0, devices:0, count:0 };
    byWorker[n].cable += parseInt(e.cable)||0;
    byWorker[n].devices += parseInt(e.devices)||0;
    byWorker[n].count++;
  });

  // сводка по разметке (шлейфы + приборы на плане)
  const objShleyfy = shleyfyForObject(id);
  const shTotal = objShleyfy.length;
  const shDone = objShleyfy.filter(s => s.status === 'done').length;
  const shWip = objShleyfy.filter(s => s.status === 'wip').length;
  const objDevices = state.devices.filter(d => d.objectId === id);
  const devTotal = objDevices.length;
  const devDone = objDevices.filter(d => d.status === 'done').length;
  const devProblem = objDevices.filter(d => d.status === 'problem').length;
  const planCableSum = objShleyfy.reduce((a, x) => a + (x.planCable || 0), 0);
  const doneCableSum = objShleyfy.reduce((a, x) => a + (x.doneCable || 0), 0);
  const shPct = shTotal ? Math.round(shDone / shTotal * 100) : 0;

  const objId = document.getElementById('entryObject').value;

function pushEntry(entry, okMsg) {
  const canSend = state.isOnline && state.user?.token;
  if (canSend) {
    syncEntry(entry).then(ok => {
      if (ok) state.entries.push({ ...entry, synced: true });
      else state.pendingEntries.push(entry);
      saveLocal(); updateOfflineBanner(); renderScreen(state.currentScreen);
    });
  } else {
    state.pendingEntries.push(entry);
    saveLocal(); updateOfflineBanner(); renderScreen(state.currentScreen);
  }
  showToast(canSend ? okMsg : '💾 Сохранено офлайн');
}

// ─── Chat ───
let chatPollTimer = null;
let bgPollTimer = null;
let chatLastRenderedId = null;

function escapeText(t) {
  return (t || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function linkify(escaped) {
  return escaped.replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank" rel="noopener" style="color:inherit;text-decoration:underline">$1</a>');
}
function dateLabel(ts) {
  const d = new Date(Number(ts));
  const today = new Date(); const y = new Date(); y.setDate(today.getDate() - 1);
  const same = (a, b) => a.toDateString() === b.toDateString();
  if (same(d, today)) return 'Сегодня';
  if (same(d, y)) return 'Вчера';
  return d.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric' });
}

function getChatMessages() {
  const serverIds = new Set((state.messages || []).map(m => m.id));
  const pend = (state.pendingMsgs || []).filter(m => !serverIds.has(m.id));
  return [...(state.messages || []), ...pend].sort((a, b) => Number(a.ts) - Number(b.ts));
}
function unreadCount() {
  const msgs = state.messages || [];
  const seen = localStorage.getItem('ops_chat_seen') || '';
  let after;
  if (!seen) after = msgs;
  else { const idx = msgs.findIndex(m => m.id === seen); after = idx >= 0 ? msgs.slice(idx + 1) : msgs; }
  return after.filter(m => m.userName !== myName()).length;
}
function updateChatBadge() {
  const el = document.getElementById('chatBadge');
  if (!el) return;
  const n = unreadCount();
  if (n > 0) { el.textContent = n > 99 ? '99+' : String(n); el.style.display = 'flex'; }
  else el.style.display = 'none';
}
function markChatSeen() {
  const msgs = state.messages || [];
  if (msgs.length) localStorage.setItem('ops_chat_seen', msgs[msgs.length - 1].id);
  updateChatBadge();
}

function renderChat(c) {
  c.innerHTML = `
    <div class="chat-list" id="chatMessages"></div>
    <button class="chat-jump" id="chatJump" onclick="scrollChatBottom()" style="display:none">↓ новые сообщения</button>
    <div class="chat-input-bar">
      <input id="chatInput" placeholder="Сообщение..." autocomplete="off" onkeydown="if(event.key==='Enter')sendMessage()">
      <button class="chat-send" onclick="sendMessage()">➤</button>
    </div>`;
  chatLastRenderedId = null;
  renderChatMessages(true);
}

function scrollChatBottom() {
  const content = document.getElementById('mainContent');
  if (content) content.scrollTop = content.scrollHeight;
  const jump = document.getElementById('chatJump');
  if (jump) jump.style.display = 'none';
}

function renderChatMessages(forceScroll) {
  const box = document.getElementById('chatMessages');
  if (!box) return;
  const content = document.getElementById('mainContent');
  const nearBottom = content ? (content.scrollHeight - content.scrollTop - content.clientHeight < 90) : true;
  const msgs = getChatMessages();
  if (msgs.length === 0) {
    box.innerHTML = `<div class="empty" style="margin-top:30px"><div class="empty-icon">💬</div><div class="empty-text">Сообщений пока нет.<br>Напишите первым!</div></div>`;
    chatLastRenderedId = null;
    return;
  }
  let html = ''; let lastDay = '';
  msgs.forEach(m => {
    const day = dateLabel(m.ts);
    if (day !== lastDay) { html += `<div class="chat-date">${day}</div>`; lastDay = day; }
    const mine = m.userName === myName();
    const crown = (m.role === 'engineer' || m.role === 'admin') ? '👑 ' : '';
    const time = new Date(Number(m.ts)).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
    let status = '';
    if (mine) {
      if (m.status === 'sending') status = ' ⏳';
      else if (m.status === 'failed') status = ` <span class="chat-retry" onclick="retrySend('${m.id}')">❗ повторить</span>`;
      else status = ' ✓';
    }
    html += `<div class="chat-msg ${mine ? 'chat-mine' : 'chat-other'}">
      <div class="chat-meta">${crown}${escapeText(m.userName || 'Без имени')} · ${time}${status}</div>
      ${linkify(escapeText(m.text))}
    </div>`;
  });
  box.innerHTML = html;
  const newLast = msgs[msgs.length - 1].id;
  const hadNew = newLast !== chatLastRenderedId;
  chatLastRenderedId = newLast;
  const jump = document.getElementById('chatJump');
  if (forceScroll || nearBottom) {
    if (content) content.scrollTop = content.scrollHeight;
    if (jump) jump.style.display = 'none';
  } else if (hadNew && jump) {
    jump.style.display = 'block';
  }
}

async function pollMessages() {
  if (!state.isOnline || !state.user?.token) return;
  try {
    const res = await fetch(`${API_URL}/api/messages`, { headers: { 'Authorization': `Bearer ${state.user.token}` } });
    if (!res.ok) return;
    const data = await res.json();
    if (!Array.isArray(data.messages)) return;
    state.messages = data.messages;
    const sids = new Set(data.messages.map(m => m.id));
    state.pendingMsgs = (state.pendingMsgs || []).filter(m => !sids.has(m.id));
    saveLocal();
    if (state.currentScreen === 'chat') { renderChatMessages(false); markChatSeen(); }
    else updateChatBadge();
  } catch {}
}

async function sendMessage() {
  const input = document.getElementById('chatInput');
  if (!input) return;
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  const msg = { id: 'msg' + Date.now() + Math.floor(Math.random() * 1000), text, ts: Date.now(), userName: myName(), role: state.user?.role, status: 'sending' };
  state.pendingMsgs = state.pendingMsgs || [];
  state.pendingMsgs.push(msg);
  renderChatMessages(true);
  deliverMsg(msg);
}
async function deliverMsg(msg) {
  if (!state.isOnline || !state.user?.token) { setMsgStatus(msg.id, 'failed'); return; }
  try {
    const res = await fetch(`${API_URL}/api/messages`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${state.user.token}` },
      body: JSON.stringify({ id: msg.id, text: msg.text, ts: msg.ts }),
    });
    if (!res.ok) throw new Error('http');
    setMsgStatus(msg.id, 'sent');
    pollMessages();
  } catch { setMsgStatus(msg.id, 'failed'); }
}
function setMsgStatus(id, status) {
  const m = (state.pendingMsgs || []).find(x => x.id === id);
  if (m) m.status = status;
  if (state.currentScreen === 'chat') renderChatMessages(false);
}
function retrySend(id) {
  const m = (state.pendingMsgs || []).find(x => x.id === id);
  if (!m) return;
  m.status = 'sending';
  renderChatMessages(false);
  deliverMsg(m);
}

function deviceShapeSvg(shape, col, num) {
  const s = 'rgba(0,0,0,.5)', w = 1.5;
  let body, nx = 12, ny = 13;
  switch (shape) {
    case 'diamond':  body = `<polygon points="12,2 22,12 12,22 2,12" fill="${col}" stroke="${s}" stroke-width="${w}"/>`; break;
    case 'square':   body = `<rect x="3" y="3" width="18" height="18" rx="3" fill="${col}" stroke="${s}" stroke-width="${w}"/>`; break;
    case 'triangle': body = `<polygon points="12,3 22,21 2,21" fill="${col}" stroke="${s}" stroke-width="${w}"/>`; ny = 16; break;
    case 'speaker':  body = `<path d="M3 9 h4 l6 -5 v16 l-6 -5 h-4 z" fill="${col}" stroke="${s}" stroke-width="${w}" stroke-linejoin="round"/><path d="M17 8 a6 6 0 0 1 0 8" fill="none" stroke="${col}" stroke-width="2"/>`; nx = 8; break;
    case 'rect':     body = `<rect x="2" y="5" width="20" height="14" rx="2" fill="${col}" stroke="${s}" stroke-width="${w}"/>`; ny = 12; break;
    case 'circle':
    default:         body = `<circle cx="12" cy="12" r="10" fill="${col}" stroke="${s}" stroke-width="${w}"/>`; break;
  }
  return `<svg viewBox="0 0 24 24" width="100%" height="100%" style="overflow:visible">${body}<text x="${nx}" y="${ny}" text-anchor="middle" dominant-baseline="central" fill="#fff" font-size="12" font-weight="700">${num || ''}</text></svg>`;
}

function showAddShleyf(objId) {
  if (!isEngineer()) return;
  addShleyfObjId = objId;
  editingShleyfId = null;

  document.getElementById('shSystem').value = 'СПС';

  document.getElementById('shPlanDevices').value = '';

}

function editShleyf(id) {
  const s = state.shleyfy.find(x => x.id === id);
  if (!s || !isEngineer()) return;
  addShleyfObjId = s.objectId;
  editingShleyfId = id;
  document.getElementById('shName').value = s.name || '';
  document.getElementById('shSystem').value = s.system || 'СПС';
  document.getElementById('shPlanCable').value = s.planCable || '';
  document.getElementById('shPlanDevices').value = s.planDevices || '';
  showModal('addShleyfModal');
}

function saveShleyf() {
  const name = document.getElementById('shName').value.trim();
  if (!name) { showToast('Введите название'); return; }
  const data = {
    objectId: addShleyfObjId,
    name,
    system: document.getElementById('shSystem').value,
    planCable: parseInt(document.getElementById('shPlanCable').value) || 0,
    planDevices: parseInt(document.getElementById('shPlanDevices').value) || 0,
  };
  if (editingShleyfId) {
    const s = state.shleyfy.find(x => x.id === editingShleyfId);
    if (s) Object.assign(s, data);
  } else {
    state.shleyfy.push({ id: 's' + Date.now(), ts: Date.now(), doneCable:0, doneDevices:0, status:'todo', assignedTo:'', ...data });
  }
  saveLocal(); syncShleyfy(); closeModal('addShleyfModal');
  showObjectDetail(addShleyfObjId);
  showToast('✅ Шлейф сохранён');
}

function deleteShleyf(id) {
  if (!confirm('Удалить шлейф?')) return;
  const s = state.shleyfy.find(x => x.id === id);
  const objId = s ? s.objectId : null;
  state.shleyfy = state.shleyfy.filter(x => x.id !== id);
  saveLocal();
  if (state.isOnline && state.user?.token) {
    fetch(`${API_URL}/api/shleyfy/delete`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${state.user.token}` },
      body: JSON.stringify({ id }),
    }).catch(() => {});
  }
  if (objId) showObjectDetail(objId);
  showToast('Удалён');
}

function renderPlanBox(objId) {

// точки участка: либо массив points (кривая), либо две точки из x1y1/x2y2 (старые прямые)
function segPts(s) {
  if (Array.isArray(s.points) && s.points.length >= 2) return s.points;
  return [{ x: s.x1, y: s.y1 }, { x: s.x2, y: s.y2 }];
}
// ломаная: прямые отрезки с резкими углами через все точки (как кабель по стенам)
function linePath(pts) {
  if (!pts.length) return '';
  let d = `M ${pts[0].x} ${pts[0].y}`;
  for (let i = 1; i < pts.length; i++) d += ` L ${pts[i].x} ${pts[i].y}`;
  return d;
}
// привязка новой точки к прямым углам относительно предыдущей (0/45/90°), если тап близко к оси
function snapAngle(px, py, x, y) {
  const dx = x - px, dy = y - py;
  if (dx === 0 && dy === 0) return { x, y };
  const len = Math.hypot(dx, dy);
  const ang = Math.atan2(dy, dx);
  const step = Math.PI / 4; // шаг 45°
  const snapped = Math.round(ang / step) * step;
  let diff = Math.abs(ang - snapped);
  if (diff > Math.PI) diff = 2 * Math.PI - diff;
  if (diff > 15 * Math.PI / 180) return { x, y }; // далеко от оси — оставляем как есть
  return {
    x: +(px + len * Math.cos(snapped)).toFixed(2),
    y: +(py + len * Math.sin(snapped)).toFixed(2),
  };
}
function segOverlaySvg(objId) {
  const W = 2.4; // толщина линии в пикселях — постоянная, не зависит от формы плана и зума
  const LINE_OP = 0.5;   // прозрачность линии (0 — невидима, 1 — сплошная); меньше = лучше видно чертёж
  const HALO_OP = 0.28;  // прозрачность тёмной подложки под линией (для контраста на пёстром плане)
  const lines = segmentsForObject(objId).map(s => {
    // линия, привязанная к шлейфу, красится по статусу шлейфа; «ничья» — по своему статусу
    const sh = s.shleyfId ? state.shleyfy.find(z => z.id === s.shleyfId) : null;
    const col = sh ? (SHLEYF_LINE_COLORS[sh.status] || SHLEYF_LINE_COLORS.todo)
                   : (SEG_COLORS[s.status] || SEG_COLORS.done);
    const d = linePath(segPts(s));
    // лёгкая тёмная подложка (чуть-чуть, для читаемости) + полупрозрачная цветная линия поверх — чертёж виден сквозь неё
    return `<path d="${d}" fill="none" stroke="rgba(0,0,0,${HALO_OP})" stroke-width="${W+1}" stroke-linecap="round" stroke-linejoin="miter" stroke-miterlimit="6" vector-effect="non-scaling-stroke"></path>`
         + `<path d="${d}" fill="none" stroke="${col}" stroke-opacity="${LINE_OP}" stroke-width="${W}" stroke-linecap="round" stroke-linejoin="miter" stroke-miterlimit="6" vector-effect="non-scaling-stroke"></path>`;
  }).join('');
  // линия, которую сейчас рисуем: предпросмотр кривой + точки-узлы
  let temp = '';
  if (drawingSegObjId === objId && segPoints.length) {
    if (segPoints.length >= 2) {
      temp += `<path d="${linePath(segPoints)}" fill="none" stroke="#e8841a" stroke-width="${W}" stroke-dasharray="4 3" stroke-linecap="round" stroke-linejoin="miter" stroke-miterlimit="6" vector-effect="non-scaling-stroke"></path>`;
    }
    temp += segPoints.map(p => `<circle cx="${p.x}" cy="${p.y}" r="1" fill="none" stroke="#e8841a" stroke-width="1.2" stroke-opacity=".85" vector-effect="non-scaling-stroke"></circle>`).join('');
  }
  return `<svg viewBox="0 0 100 100" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none">${lines}${temp}</svg>`;
}
function pinsOverlayHtml(objId, drawing) {
  const did = activeDid(objId);
  return shleyfyForObject(objId).filter(s => typeof s.pinX === 'number' && typeof s.pinY === 'number' && (s.pinDrawingId || objId) === did).map(s => {
    const col = SHLEYF_COLORS[s.status] || SHLEYF_COLORS.todo;
    return `<div onclick="event.stopPropagation();showShleyfDetail('${s.id}')" title="${s.name}"
      style="position:absolute;left:${s.pinX}%;top:${s.pinY}%;transform:translate(-50%,-50%);width:20px;height:20px;border-radius:50%;background:${col};border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.6);cursor:pointer;pointer-events:${drawing ? 'none' : 'auto'}"></div>`;
  }).join('');
}
function planImgHtml(objId, eng) {
  const did = activeDid(objId);
  const placing = placingShleyfId && state.shleyfy.find(z => z.id === placingShleyfId)?.objectId === objId;
  const drawing = drawingSegObjId === objId;
  const placingDevSh = placingDeviceShleyfId && state.shleyfy.find(z => z.id === placingDeviceShleyfId)?.objectId === objId
    ? state.shleyfy.find(z => z.id === placingDeviceShleyfId) : null;
  const lock = placing || drawing || !!placingDevSh;
  return `
    ${placing ? `<div style="font-size:13px;color:var(--yellow);margin-bottom:6px">Тапните на плане, куда поставить метку. <a onclick="cancelPlacing('${objId}')" style="color:var(--text2);text-decoration:underline;cursor:pointer">Отмена</a></div>` : ''}
    ${placingDevSh ? `<div style="font-size:13px;color:var(--green);margin-bottom:6px">Ставим: <b>${devType(placingDeviceType).name}</b> — тап = прибор. <a onclick="chooseDeviceTypeForPlacing('${placingDevSh.id}')" style="color:var(--text2);text-decoration:underline;cursor:pointer">сменить тип</a> · <a onclick="stopPlacingDevice('${objId}')" style="color:var(--text2);text-decoration:underline;cursor:pointer">Готово</a></div>` : ''}
    ${drawing ? `<div style="font-size:13px;color:#e8841a;margin-bottom:6px">Тапайте точки линии по очереди (точек: ${segPoints.length}).<br>
      <a onclick="finishSegLine('${objId}')" style="color:var(--green);text-decoration:underline;cursor:pointer">✓ Завершить линию</a> · 
      <a onclick="undoSegPoint('${objId}')" style="color:var(--text2);text-decoration:underline;cursor:pointer">⌫ убрать точку</a> · 
      <a onclick="stopDrawingSeg('${objId}')" style="color:var(--text2);text-decoration:underline;cursor:pointer">выйти</a></div>` : ''}
    <div style="position:relative;line-height:0">
      <img src="${planCache[did]}" onclick="planClick(event,'${objId}')"
        style="width:100%;border-radius:8px;border:1px solid var(--border);display:block;cursor:${lock ? 'crosshair' : 'default'}">
      ${segOverlaySvg(objId)}
      ${pinsOverlayHtml(objId, lock)}
      ${devicesOverlayHtml(objId, lock)}
    </div>
    <div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap">
      <button class="btn btn-secondary btn-sm" onclick="openPlanViewer('${objId}')">⛶ На весь экран</button>
      <button class="btn btn-secondary btn-sm" onclick="startDrawingSeg('${objId}')">✏️ Рисовать участки</button>
      ${eng ? `<button class="btn btn-secondary btn-sm" onclick="triggerPlanUpload('${objId}', false)">Заменить картинку</button>
      <button class="btn btn-secondary btn-sm" onclick="renameDrawing('${objId}')">✎ Имя</button>
      <button class="btn btn-danger btn-sm" onclick="deletePlan('${objId}')">Удалить чертёж</button>` : ''}
    </div>`;
}
function planClick(ev, objId) {
  const img = ev.currentTarget;
  const rect = img.getBoundingClientRect();
  const x = Math.max(0, Math.min(100, ((ev.clientX - rect.left) / rect.width) * 100));
  const y = Math.max(0, Math.min(100, ((ev.clientY - rect.top) / rect.height) * 100));
  // 1) постановка метки шлейфа
  if (placingShleyfId) {
    const s = state.shleyfy.find(z => z.id === placingShleyfId);
    if (s) { s.pinX = x; s.pinY = y; s.pinDrawingId = activeDid(objId); saveLocal(); syncShleyfy(); }
    placingShleyfId = null;
    refreshPlan(objId);
    showToast('📍 Метка поставлена');
    return;
  }
  // 1b) постановка приборов шлейфа: каждый тап = прибор, остаёмся в режиме
  if (placingDeviceShleyfId) {
    const sh = state.shleyfy.find(z => z.id === placingDeviceShleyfId);
    if (sh && sh.objectId === objId) {
      addDeviceAt(sh, x, y);
      refreshPlan(objId);
    }
    return;
  }
  // 2) рисование линии: каждый тап добавляет точку (с привязкой к прямым углам)
  if (drawingSegObjId === objId) {
    let nx = +x.toFixed(2), ny = +y.toFixed(2);
    if (segPoints.length > 0) {
      const prev = segPoints[segPoints.length - 1];
      const sp = snapAngle(prev.x, prev.y, nx, ny);
      nx = sp.x; ny = sp.y;
    }
    segPoints.push({ x: nx, y: ny });
    refreshPlan(objId);
    if (segPoints.length === 1) showToast('Точка 1. Тапайте дальше, потом «Завершить»');
    return;
  }
  // 3) обычный тап — открыть ближайший участок (по кривой)
  const segs = segmentsForObject(objId);
  let best = null, bestD = 4;
  for (const s of segs) {
    const pts = segPts(s);
    for (let i = 0; i < pts.length - 1; i++) {
      const d = pointDistToSeg(x, y, pts[i].x, pts[i].y, pts[i + 1].x, pts[i + 1].y);
      if (d < bestD) { bestD = d; best = s; }
    }
  }
  if (best) openSegOrShleyf(best);
}

function pointDistToSeg(px, py, x1, y1, x2, y2) {
  const dx = x2 - x1, dy = y2 - y1;
  const len2 = dx * dx + dy * dy;
  let t = len2 ? ((px - x1) * dx + (py - y1) * dy) / len2 : 0;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(px - (x1 + t * dx), py - (y1 + t * dy));
}

  if (!isEngineer()) return;
  if (!state.isOnline || !state.user?.token) { showToast('Загрузка плана — только онлайн'); return; }
  currentPlanObjId = objId;
  planUploadSplit = !!split;
  const inp = document.getElementById('planFileInput');
  inp.value = '';
  inp.click();
}
function handlePlanFile(ev) {
  const file = ev.target.files && ev.target.files[0];
  if (!file) return;
  const objId = currentPlanObjId;
  const split = planUploadSplit;
  const isPdf = file.type === 'application/pdf' || /\.pdf$/i.test(file.name || '');
  if (isPdf) { renderPdfPlan(file, objId, split); return; }
  // Картинка (jpg/png/...) — как раньше: сжать до 2400px
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      const maxW = 2400;
      const scale = Math.min(1, maxW / img.width);
      const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h);
      ctx.drawImage(img, 0, 0, w, h);
      const url = canvas.toDataURL('image/jpeg', 0.82);
      if (split) {
        // «Добавить чертёж» — создаём новый чертёж только сейчас, когда файл выбран
        const n = drawingsForObject(objId).length + 1;
        addPageDrawing(objId, 'Чертёж ' + n, url, true, Date.now()).then(() => renderPlanBox(objId));
      } else {
        savePlanDataUrl(objId, url); // «Заменить картинку» — в текущий чертёж
      }
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}

// Рендер PDF. Одна страница → чёткая картинка в активный чертёж.
// Многостраничный (если split=true) → каждый лист становится отдельным чертежом «Лист 1, Лист 2…».
function renderPdfPlan(file, objId, split) {
  if (!window.pdfjsLib) { showToast('PDF-движок не загрузился — нужен интернет, обновите страницу'); return; }
  showToast('Обработка PDF…');
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/legacy/build/pdf.worker.min.js';
  // отрисовать страницу num в jpeg dataURL (targetW — целевая ширина в px)
  const renderOne = (pdf, num, targetW) => pdf.getPage(num).then(page => {
    const base = page.getViewport({ scale: 1 });
    let scale = targetW / base.width;
    const longest = Math.max(base.width, base.height) * scale;
    if (longest > 4000) scale *= 4000 / longest; // защита памяти на больших листах
    const vp = page.getViewport({ scale });
    const canvas = document.createElement('canvas');
    canvas.width = Math.round(vp.width);
    canvas.height = Math.round(vp.height);
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    return page.render({ canvasContext: ctx, viewport: vp }).promise.then(() => {
      const url = canvas.toDataURL('image/jpeg', 0.85);
      canvas.width = canvas.height = 0; // освобождаем память сразу
      return url;
    });
  });
  const reader = new FileReader();
  reader.onload = () => {
    const buf = new Uint8Array(reader.result);
    pdfjsLib.getDocument({ data: buf }).promise.then(pdf => {
      const total = pdf.numPages;
      // РЕЖИМ ЗАМЕНЫ (split=false): только 1-я страница в активный чертёж
      if (!split) {
        return renderOne(pdf, 1, 3000).then(url => savePlanDataUrl(objId, url));
      }
      // РЕЖИМ ДОБАВЛЕНИЯ, одна страница → один новый чертёж «Чертёж N»
      if (total <= 1) {
        const n = drawingsForObject(objId).length + 1;
        return renderOne(pdf, 1, 3000)
          .then(url => addPageDrawing(objId, 'Чертёж ' + n, url, true, Date.now()))
          .then(() => renderPlanBox(objId));
      }
      // РЕЖИМ ДОБАВЛЕНИЯ, многостраничный → отдельный чертёж на каждый лист
      showToast(`PDF: ${total} лист. — раскладываю…`);
      const baseTs = Date.now();
      let chain = Promise.resolve();
      for (let k = 1; k <= total; k++) {
        const num = k;
        chain = chain
          .then(() => renderOne(pdf, num, 2400))
          .then(url => addPageDrawing(objId, 'Лист ' + num, url, num === 1, baseTs + num));
      }
      return chain.then(() => { renderPlanBox(objId); showToast(`✅ Загружено листов: ${total}`); });
    }).catch(err => { console.error('pdf render:', err); showToast('Не удалось открыть PDF'); });
  };
  reader.onerror = () => showToast('Не удалось прочитать файл');
  reader.readAsArrayBuffer(file);
}

// Создать НОВЫЙ чертёж с картинкой (для «Добавить чертёж» и листов многостраничного PDF).
// Чертёж появляется только здесь — когда картинка уже готова, так пустышки не плодятся.
function addPageDrawing(objId, name, dataUrl, makeActive, ts) {
  const did = 'dr' + (ts || Date.now()) + Math.floor(Math.random() * 1000);
  state.drawings.push({ id: did, objectId: objId, name, ts: ts || Date.now() });
  planCache[did] = dataUrl;
  if (makeActive) activeDrawing[objId] = did;
  const obj = state.objects.find(o => o.id === objId);
  if (obj) obj.hasPlan = true;
  saveLocal();
  return fetch(`${API_URL}/api/drawings/save`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${state.user.token}` },
    body: JSON.stringify({ id: did, objectId: objId, name, image: dataUrl }),
  }).then(r => { if (!r.ok) showToast(name + ': большой файл или ошибка сети'); })
    .catch(() => showToast(name + ': не загрузился'));
}

// Сохранение картинки в активный чертёж (картинка или отрендеренный PDF)
function savePlanDataUrl(objId, dataUrl) {
  const did = activeDid(objId);
  if (!did) { showToast('Сначала добавьте чертёж'); return; }
  planCache[did] = dataUrl;
  const obj = state.objects.find(o => o.id === objId);
  if (obj) obj.hasPlan = true;
  saveLocal();
  renderPlanBox(objId);
  showToast('Загрузка чертежа…');
  fetch(`${API_URL}/api/drawings/save`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${state.user.token}` },
    body: JSON.stringify({ id: did, objectId: objId, name: drawingName(did), image: dataUrl }),
  })
    .then(r => r.ok ? showToast('✅ Чертёж загружен') : showToast('Слишком большой файл или ошибка сети'))
    .catch(() => showToast('Не удалось загрузить чертёж'));
}
function deletePlan(objId) {
  if (!isEngineer()) return;
  const did = activeDid(objId);
  if (!did) return;
  if (!confirm('Удалить чертёж «' + drawingName(did) + '» со всей его разметкой?')) return;
  // убираем локально: чертёж, его картинку, линии и приборы на нём
  state.drawings = state.drawings.filter(d => d.id !== did);
  state.planSegments = state.planSegments.filter(s => (s.drawingId || s.objectId) !== did);
  state.devices = state.devices.filter(d => (d.drawingId || d.objectId) !== did);
  delete planCache[did];
  delete activeDrawing[objId];
  if (!drawingsForObject(objId).length) { const obj = state.objects.find(o => o.id === objId); if (obj) obj.hasPlan = false; }
  saveLocal();
  if (state.isOnline && state.user?.token) {
    fetch(`${API_URL}/api/drawings/delete`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${state.user.token}` },
      body: JSON.stringify({ id: did }),
    }).catch(() => {});
  }
  renderPlanBox(objId);
  showToast('Чертёж удалён');
}

// ─── Projects screen ───
function renderProjects(c) {
  const objs = visibleObjects();
  const projs = visibleProjects();
  const eng = isEngineer();
  let html = '<div style="padding:14px">';
  if (eng) html += `<button class="btn btn-primary" onclick="showAddProject()" style="margin-bottom:14px">+ Новый проект</button>`;
  if (projs.length === 0) {
    html += `<div class="empty"><div class="empty-icon">📐</div><div class="empty-text">${eng ? 'Проектов пока нет.<br>Добавьте первый проект к объекту.' : 'Проектов по вашим объектам пока нет.'}</div></div>`;
  } else {
    objs.forEach(o => {
      const list = projs.filter(p => p.objectId === o.id);
      if (list.length === 0) return;
      html += `<div class="section-header" style="padding-left:0">${o.name}</div>`;
      list.forEach(p => { html += projectCardHtml(p, eng); });
    });
  }
  html += '</div>';
  c.innerHTML = html;
}

function projectCardHtml(p, eng) {
  return `
    <div class="entry-card" style="margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px">
        <span class="entry-tag">${p.type || 'Проект'}</span>
        ${eng ? `<div style="display:flex;gap:6px">
          <button class="btn btn-secondary btn-sm" onclick="editProject('${p.id}')">✏️</button>
          <button class="btn btn-danger btn-sm" onclick="deleteProject('${p.id}')">×</button>
        </div>` : ''}
      </div>
      <div style="font-size:13px;color:var(--text2);line-height:1.7">
        🧵 Кабель: <b>${p.planCable || 0} м</b>${p.cableType ? ' · ' + p.cableType : ''}<br>
        🔌 Приборы: <b>${p.planDevices || 0} шт</b>${p.deviceType ? ' · ' + p.deviceType : ''}
      </div>
      ${p.drawingUrl ? `<div style="margin-top:8px"><button class="btn btn-secondary btn-sm" onclick="openDrawing('${p.id}')">📐 ${p.drawingName || 'Открыть чертёж'}</button></div>` : ''}
    </div>`;
}

function openDrawing(id) {
  const p = state.projects.find(x => x.id === id);
  if (!p || !p.drawingUrl) return;
  let url = p.drawingUrl.trim();
  if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
  window.open(url, '_blank', 'noopener');
}

function fillProjectObjectSelect(selectedId) {
  document.getElementById('projObject').innerHTML =
    visibleObjects().map(o => `<option value="${o.id}" ${o.id===selectedId?'selected':''}>${o.name}</option>`).join('');
}

function showAddProject() {
  if (!isEngineer()) return;
  if (visibleObjects().length === 0) { showToast('Сначала создайте объект'); return; }
  editingProjectId = null;
  document.getElementById('projModalTitle').textContent = '📐 Новый проект';
  fillProjectObjectSelect(null);
  document.getElementById('projType').value = PROJECT_TYPES[0];
  ['projPlanCable','projCableType','projPlanDevices','projDeviceType','projDrawingUrl','projDrawingName']
    .forEach(id => document.getElementById(id).value = '');
  showModal('addProjectModal');
}

function editProject(id) {
  const p = state.projects.find(x => x.id === id);
  if (!p) return;
  editingProjectId = id;
  document.getElementById('projModalTitle').textContent = '✏️ Проект';
  fillProjectObjectSelect(p.objectId);
  document.getElementById('projType').value = p.type || PROJECT_TYPES[0];
  document.getElementById('projPlanCable').value = p.planCable || '';
  document.getElementById('projCableType').value = p.cableType || '';
  document.getElementById('projPlanDevices').value = p.planDevices || '';
  document.getElementById('projDeviceType').value = p.deviceType || '';
  document.getElementById('projDrawingUrl').value = p.drawingUrl || '';
  document.getElementById('projDrawingName').value = p.drawingName || '';
  showModal('addProjectModal');
}

function saveProject() {
  const objectId = document.getElementById('projObject').value;
  if (!objectId) { showToast('Выберите объект'); return; }
  const data = {
    objectId,
    type: document.getElementById('projType').value,
    planCable: parseInt(document.getElementById('projPlanCable').value) || 0,
    cableType: document.getElementById('projCableType').value.trim(),
    planDevices: parseInt(document.getElementById('projPlanDevices').value) || 0,
    deviceType: document.getElementById('projDeviceType').value.trim(),
    drawingUrl: document.getElementById('projDrawingUrl').value.trim(),
    drawingName: document.getElementById('projDrawingName').value.trim(),
  };
  if (editingProjectId) {
    const p = state.projects.find(x => x.id === editingProjectId);
    if (p) Object.assign(p, data);
  } else {
    state.projects.push({ id: 'p' + Date.now(), ts: Date.now(), ...data });
  }
  saveLocal(); syncProjects(); closeModal('addProjectModal'); renderScreen('projects');
  showToast('✅ Проект сохранён');
}

function deleteProject(id) {
  if (!confirm('Удалить проект?')) return;
  state.projects = state.projects.filter(p => p.id !== id);
  saveLocal();
  if (state.isOnline && state.user?.token) {
    fetch(`${API_URL}/api/projects/delete`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${state.user.token}` },
      body: JSON.stringify({ id }),
    }).catch(() => {});
  }
  renderScreen('projects'); showToast('Удалён');
}

async function syncProjects() {
  if (!state.isOnline || !state.user?.token || !isEngineer()) return;
  try {
    await fetch(`${API_URL}/api/projects/sync`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${state.user?.token}` },
      body: JSON.stringify({ projects: state.projects }),
    });
  } catch {}
}

async function syncShleyfy() {
  if (!state.isOnline || !state.user?.token || !isEngineer()) return;
  try {
    await fetch(`${API_URL}/api/shleyfy/sync`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${state.user?.token}` },
      body: JSON.stringify({ shleyfy: state.shleyfy }),
    });
  } catch {}
}

async function syncObjects() {
  if (!state.isOnline || !state.user?.token || !isEngineer()) return;
  try {
    await fetch(`${API_URL}/api/objects/sync`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${state.user?.token}` },
      body: JSON.stringify({ objects: state.objects }),
    });
  } catch {}
}
async function syncTeam() {
  if (!state.isOnline || !state.user?.token || !isEngineer()) return;
  try {
    await fetch(`${API_URL}/api/team/sync`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${state.user?.token}` },
      body: JSON.stringify({ team: state.team }),
    });
  } catch {}
}
async function syncAll(silent = false) {
  if (!state.isOnline) { if (!silent) showToast('Нет подключения к интернету'); return; }
  if (!state.user?.token) { if (!silent) showToast('Войдите через Telegram-бота, чтобы синхронизировать'); return; }
  const btn = document.getElementById('syncBtn');
  if (btn) btn.classList.add('syncing');

  await syncObjects();
  await syncTeam();
  await syncProjects();
  await syncShleyfy();

  const synced = [];
  for (const entry of state.pendingEntries) {
    const ok = await syncEntry(entry);
    if (ok) { synced.push(entry.id); state.entries.push({ ...entry, synced: true }); }
  }
  state.pendingEntries = state.pendingEntries.filter(e => !synced.includes(e.id));

  try {
    const res = await fetch(`${API_URL}/api/sync`, { headers: { 'Authorization': `Bearer ${state.user?.token}` } });
    if (res.ok) {
      const data = await res.json();
      if (Array.isArray(data.objects)) state.objects = data.objects;
      if (Array.isArray(data.team)) state.team = data.team;
      if (Array.isArray(data.projects)) state.projects = data.projects;
      if (Array.isArray(data.shleyfy)) state.shleyfy = data.shleyfy;
      if (Array.isArray(data.shleyfLog)) state.shleyfLog = data.shleyfLog;
      if (Array.isArray(data.segments)) state.planSegments = data.segments;
      if (Array.isArray(data.devices)) state.devices = data.devices;
      if (Array.isArray(data.drawings)) state.drawings = data.drawings;
      if (Array.isArray(data.entries)) {
        const ids = new Set(state.entries.map(e => e.id));
        data.entries.forEach(e => { if (!ids.has(e.id)) state.entries.push(e); });
      }
    }
  } catch {}

  saveLocal();
  if (btn) btn.classList.remove('syncing');
  updateOfflineBanner();
  renderScreen(state.currentScreen);
  if (!silent || synced.length > 0) showToast(synced.length > 0 ? `✅ Синхронизировано ${synced.length} записей` : '✅ Всё актуально');
}

// ─── Storage ───
function saveLocal() {
  localStorage.setItem('ops_objects', JSON.stringify(state.objects));
  localStorage.setItem('ops_entries', JSON.stringify(state.entries));
  localStorage.setItem('ops_pending', JSON.stringify(state.pendingEntries));
  localStorage.setItem('ops_team',    JSON.stringify(state.team));
  localStorage.setItem('ops_projects', JSON.stringify(state.projects));
  localStorage.setItem('ops_shleyfy', JSON.stringify(state.shleyfy));
  localStorage.setItem('ops_shleyflog', JSON.stringify(state.shleyfLog));
  localStorage.setItem('ops_segments', JSON.stringify(state.planSegments));
  localStorage.setItem('ops_devices', JSON.stringify(state.devices));
  localStorage.setItem('ops_drawings', JSON.stringify(state.drawings));
  localStorage.setItem('ops_messages', JSON.stringify(state.messages));
  localStorage.setItem('ops_user',    JSON.stringify(state.user));
}

// ─── Modals & toast ───
function showModal(id) { document.getElementById(id).classList.add('show'); }
function closeModal(id) { document.getElementById(id).classList.remove('show'); }
document.querySelectorAll('.modal-overlay').forEach(m => m.addEventListener('click', e => { if (e.target === m) m.classList.remove('show'); }));
function showToast(msg, duration = 2500) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), duration);
}

// ─── Init ───
function init() {
  if ('serviceWorker' in navigator) { navigator.serviceWorker.register('/sw.js').catch(() => {}); }
  if (!state.user || !state.user.token) {
    showLogin();
  } else {
    startApp();
  }
}
function showLogin() {
  document.getElementById('loginScreen').classList.add('show');
}
function startApp() {
  document.getElementById('loginScreen').classList.remove('show');
  updateOfflineBanner();
  showScreen('home');
  if (state.isOnline && state.user?.token) { syncAll(true); pollMessages(); }
}
init();

</script>
